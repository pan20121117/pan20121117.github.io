<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 3 - AI 問答小助手</title>
<style>
  body {
    font-family: "Microsoft JhengHei", sans-serif;
    background: #0b1120; color: #e2e8f0; margin: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 14px; min-height: 100vh; box-sizing: border-box;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 18px; text-align: center; }
  .back { margin-bottom: 16px; text-align: center; }
  .back a {
    display: inline-block; padding: 9px 22px; border-radius: 999px;
    background: #1e293b; border: 1px solid #334155; color: #93c5fd;
    text-decoration: none; font-size: 14px; font-weight: bold;
    transition: background .2s, transform .2s;
  }
  .back a:hover { background: #334155; transform: translateY(-2px); }
  .box { width: 100%; max-width: 560px; }
  .setting {
    background: #1e293b; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 14px; font-size: 14px;
  }
  .setting label { display: block; color: #94a3b8; margin-bottom: 6px; }
  .setting input, .setting select {
    width: 100%; padding: 9px 12px; border-radius: 8px; box-sizing: border-box;
    border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px;
  }
  .notice { color: #fbbf24; font-size: 12px; margin-top: 8px; line-height: 1.5; }

  #chat {
    background: #1e293b; border-radius: 14px; padding: 16px;
    height: 320px; overflow-y: auto; margin-bottom: 12px;
  }
  .msg { margin-bottom: 12px; line-height: 1.6; }
  .who { font-size: 12px; color: #64748b; margin-bottom: 3px; }
  .bubble { display: inline-block; padding: 9px 14px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; }
  .me .bubble { background: #38bdf8; color: #0b1120; }
  .ai .bubble { background: #0f172a; color: #e2e8f0; }
  .me { text-align: right; }

  .composer { display: flex; gap: 8px; }
  .composer input { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; }
  .composer button { padding: 13px 22px; border: none; border-radius: 12px; background: #34d399; color: #0b1120; font-weight: bold; font-size: 15px; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
  <h1>🤖 AI 問答小助手</h1>
  <div class="sub">自己做的 AI 聊天機器人，由 OpenRouter 免費模型回答</div>

  <div class="back"><a href="https://pan20121117.github.io/">← 回到首頁</a></div>

  <div class="box">
    <!-- 設定區 -->
    <div class="setting">
      <label>① 你的 OpenRouter API 金鑰（只存在你自己的瀏覽器）</label>
      <input id="key" type="password" placeholder="sk-or-v1-...">
      <div class="notice">
        🔒 金鑰僅儲存在這台電腦的瀏覽器 localStorage，不會上傳到任何地方。<br>
        ⚠️ 做作業時「千萬不要」把金鑰寫進程式碼後上傳 GitHub，會被人盜用。
      </div>
    </div>

    <div class="setting">
      <label>② 選一個免費模型（自動從 OpenRouter 抓取）</label>
      <select id="model"><option>載入中…</option></select>
    </div>

    <!-- 對話區 -->
    <div id="chat"></div>

    <div class="composer">
      <input id="q" placeholder="問我任何問題…" onkeydown="if(event.key==='Enter')ask()">
      <button id="send" onclick="ask()">送出</button>
    </div>
  </div>

<script>
const OPENROUTER_URL = "https://openrouter.ai/api/v1/chat/completions";
const keyInput = document.getElementById("key");
const modelSel = document.getElementById("model");

// 載入時把金鑰從瀏覽器記憶中讀回來
keyInput.value = localStorage.getItem("or_key") || "";
keyInput.addEventListener("input", () => localStorage.setItem("or_key", keyInput.value));

// 自動抓取目前所有「免費」模型，讓學生不用背模型名稱
async function loadModels() {
  try {
    const res = await fetch("https://openrouter.ai/api/v1/models");
    const data = await res.json();
    const free = data.data.filter(m => m.id.endsWith(":free"));
    modelSel.innerHTML = "";
    free.forEach(m => {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = m.name + "  (" + m.id + ")";
      modelSel.appendChild(o);
    });
    const saved = localStorage.getItem("or_model");
    if (saved) modelSel.value = saved;
    modelSel.addEventListener("change", () => localStorage.setItem("or_model", modelSel.value));
  } catch (e) {
    modelSel.innerHTML = "<option>無法載入模型清單</option>";
  }
}
loadModels();

function addMsg(who, text) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + (who === "我" ? "me" : "ai");
  div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector(".bubble");
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  const key = keyInput.value.trim();
  if (!q) return;
  if (!key) { alert("請先貼上你的 OpenRouter 金鑰（第①格）"); return; }

  document.getElementById("q").value = "";
  addMsg("我", q);
  const bubble = addMsg("AI", "思考中…");
  const btn = document.getElementById("send");
  btn.disabled = true;

  try {
    const res = await fetch(OPENROUTER_URL, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: modelSel.value,
        messages: [
          { role: "system", content: "你是一位親切的老師，用繁體中文回答國中生，盡量簡短、舉例說明。" },
          { role: "user", content: q }
        ]
      })
    });

    const data = await res.json();
    if (data.error) {
      bubble.textContent = "錯誤：" + (data.error.message || JSON.stringify(data.error));
    } else {
      bubble.textContent = data.choices[0].message.content;
    }
  } catch (e) {
    bubble.textContent = "連線失敗：" + e.message;
  } finally {
    btn.disabled = false;
  }
}

// 進階作業：
// 1. 加「清除對話」按鈕
// 2. 把對話紀錄存到 localStorage，重新整理後還在
// 3. 加上天氣：問「台北天氣」時自動去呼叫 Open-Meteo
</script>
</body>
</html>
